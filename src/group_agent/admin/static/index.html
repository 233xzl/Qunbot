<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Qunbot · 管理台</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <script defer src="/assets/settings-text.js"></script>
    <script defer src="/assets/providers.js"></script>
    <script defer src="/assets/app.js"></script>
  </head>
  <body>
    <section id="login" class="login">
      <form id="login-form" class="login-card">
        <div class="brand"><span class="brand-icon">Q</span> Qunbot</div>
        <h1>欢迎回来</h1>
        <p class="muted">输入管理密钥，打开你的群聊控制台。</p>
        <label
          >管理密钥<input
            id="key"
            type="password"
            autocomplete="current-password"
            required
            placeholder="粘贴本地初始化时生成的密钥" /></label
        ><button class="primary" type="submit">
          登录管理台 <span>→</span>
        </button>
        <p id="login-error" role="alert"></p>
        <small class="muted">密钥可通过本地 admin reset-key 命令重置。</small>
      </form>
    </section>
    <div id="shell" hidden>
      <aside id="sidebar">
        <div class="brand">
          <span class="brand-icon">Q</span> Qunbot <small>控制台</small>
        </div>
        <nav id="nav"></nav>
        <div class="sidebar-bottom">
          <span id="connection" class="muted">本地实例</span
          ><button id="logout" class="nav-item">↗　退出登录</button>
        </div>
      </aside>
      <div class="workspace">
        <header>
          <button id="menu" aria-label="打开导航">☰</button
          ><span id="breadcrumb">工作空间 / 总览</span
          ><span id="engine-badge" class="badge">未启动</span>
        </header>
        <main>
          <div class="page-heading">
            <div>
              <h1 id="title">总览</h1>
              <p id="subtitle" class="muted"></p>
            </div>
            <span id="dirty" class="badge" hidden>有未保存修改</span>
          </div>
          <div id="content"></div>
          <div id="editor-actions" class="action-bar" hidden>
            <span id="save-status" class="muted"
              >修改后保存，再应用到运行引擎</span
            ><button id="save" class="secondary">保存草稿</button
            ><button id="apply" class="primary">保存并应用</button>
          </div>
        </main>
        <footer>Qunbot · 本地管理台 <span>数据每 5 秒更新</span></footer>
      </div>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="dialog">
      <div id="dialog-content"></div>
      <div class="dialog-actions">
        <button id="dialog-close" class="secondary">关闭</button
        ><button id="dialog-confirm" class="primary" hidden>确认应用</button>
      </div>
    </dialog>
  </body>
</html>
